[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-document-pipeline"
version = "0.1.0"
description = "Event-driven ingestion pipeline for pharmaceutical PDF documents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "Pillow>=10,<12",
    "pytesseract>=0.3.10,<0.4",
    "watchdog>=4,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
retrieval = [
    "numpy==2.0.2",
    "sentence-transformers==5.1.2",
    "torch==2.8.0",
    "transformers==4.57.6",
]

[project.scripts]
pharma-pipeline = "pharma_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
