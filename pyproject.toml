[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-document-pipeline"
version = "0.1.0"
description = "Event-driven ingestion pipeline for pharmaceutical PDF documents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34,<2",
    "PyMuPDF>=1.24,<2",
    "Pillow>=10,<12",
    "pytesseract>=0.3.10,<0.4",
    "watchdog>=4,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
retrieval = [
    "numpy==2.0.2",
    "sentence-transformers==5.1.2",
    "torch==2.8.0",
    "transformers==4.57.6",
]
serve = [
    "fastapi>=0.112,<0.113",
    "gradio==4.44.1",
    "huggingface-hub>=0.19.3,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<2.11",
    "starlette>=0.37.2,<0.39",
    "uvicorn>=0.30,<1",
]

[project.scripts]
pharma-pipeline = "pharma_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
